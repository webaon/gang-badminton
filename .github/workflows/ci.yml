name: CI (PR gate)

# 🔴 **[WO-5.E]** baseline §CI Gates: "ต่อ PR (เร็ว): type check → ESLint → unit tests → build"
#    ของช้า (RLS · concurrency · Playwright) อยู่ใน `full.yml` ที่รันบน main และรายคืน
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # เทสต์ที่ไม่ต้องมีฐานข้อมูล — domain/pure logic + guard ของ CSP/landing
      - name: Unit tests
        run: npm run test:unit

      # ⚠️ `NEXT_PUBLIC_*` ถูก **inline ตอน build** ⇒ ต้องมีค่าตั้งแต่ตอนนี้
      #    (ไม่ใส่แล้ว client component ที่ต่อ realtime จะพังทั้งหน้าตอนรันจริง — เจอมาแล้วใน WO-5.E)
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-time-placeholder

      # หน้า prerender ต้องอยู่ใน STATIC_ROUTES ครบ — เทสต์นี้อ่าน build manifest จริง
      - name: CSP static-route guard
        run: npx vitest run tests/security/csp.test.ts
