name: CI

on:
  pull_request:
  push:
    branches: [main]

# PR ที่ push ซ้ำระหว่างที่รอบเก่ายังรันอยู่ ให้ยกเลิกรอบเก่าทิ้ง
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # ─────────────────────────────────────────────────────────────────────
      # ตรวจแบบไม่ต้องใช้ฐานข้อมูล — ทำก่อนเพื่อให้ fail เร็ว
      # ─────────────────────────────────────────────────────────────────────
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # ─────────────────────────────────────────────────────────────────────
      # เทสต์ต้องใช้ Supabase จริง ไม่ใช่ Postgres เปล่า
      #
      # เหตุผล: ชุดเทสต์แตะ auth.users, storage.objects, schema cron และต่อผ่าน
      # **pooled port (supavisor)** ตามที่ baseline §Verification บังคับ
      # ⇒ `services: postgres` ธรรมดาใช้แทนไม่ได้
      #
      # -x ตัดเฉพาะตัวที่ไม่ได้ใช้ (studio/logflare/vector/edge-runtime/mailpit)
      #    ห้ามตัด supavisor เพราะเทสต์ต่อผ่านพอร์ต 54329
      # ─────────────────────────────────────────────────────────────────────
      - uses: supabase/setup-cli@v1
        with:
          version: 2.112.0

      - name: Start Supabase
        run: supabase start -x studio,logflare,vector,edge-runtime,mailpit

      - name: Show migration status
        run: supabase migration list --local

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Supabase logs (เฉพาะตอนพัง)
        if: failure()
        run: |
          docker ps -a
          supabase status || true
          for c in $(docker ps -aq --filter "name=supabase_"); do
            echo "===== $(docker inspect --format '{{.Name}}' "$c") ====="
            docker logs --tail 80 "$c" 2>&1 || true
          done

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup || true
